# =====================================================================
# n8n + Caddy, and nothing else.
#
# This is the compose to use when the database is Supabase and the
# dashboard is on Vercel — which leaves this host with exactly one job.
# It runs unchanged on:
#
#   · an Oracle Cloud Always Free Ampere A1 (arm64)  — see ops/oracle/
#   · a $6 DigitalOcean droplet (1 GB, amd64)
#   · a second n8n beside Clinibot's on the existing droplet
#
# The n8n image is multi-arch, so arm64 needs no special handling here.
#
# NOT ops/self-hosted/docker-compose.prod.yml — that one also runs
# Postgres and needs ~2 GB. Nothing on this host needs a database:
# acq lives in Supabase, and n8n keeps its own state in SQLite.
#
#   docker compose -f ops/docker-compose.n8n.yml --project-directory . up -d
# =====================================================================

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: n8n-acq
    restart: unless-stopped
    ports:
      # Loopback only. n8n's sole authentication is an owner account created
      # on first visit, so between `up` and that visit an exposed instance is
      # an unauthenticated console. Reach the UI over an SSH tunnel:
      #   ssh -L 5679:127.0.0.1:5679 <host>
      #
      # The host port is a variable because co-locating beside Clinibot's n8n
      # means 5678 is already taken — set N8N_HOST_PORT=5679 there.
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"

    # A ceiling, so a runaway execution restarts one container instead of
    # letting the OOM killer choose a victim on a small box. 700m suits 1 GB;
    # raise it on an Ampere A1, where memory is not the constraint.
    mem_limit: ${N8N_MEM_LIMIT:-700m}

    environment:
      # Generate once and BACK IT UP: openssl rand -hex 32
      # Lose it and every stored credential is permanently unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
      # https behind Caddy; http when reached only through an SSH tunnel.
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      # Every unsubscribe link in every email is built from this.
      WEBHOOK_URL: ${WEBHOOK_URL:?set WEBHOOK_URL in .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Karachi}
      TZ: ${GENERIC_TIMEZONE:-Asia/Karachi}

      # Behind Caddy both are right. Over a plain-HTTP SSH tunnel the cookie
      # MUST be false, or n8n drops the login cookie and sign-in silently
      # fails to persist — you log in, and land back on the login page.
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-true}"
      N8N_PROXY_HOPS: "${N8N_PROXY_HOPS:-1}"
      N8N_PUBLIC_API_DISABLED: "true"

      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /tmp
      N8N_PAYLOAD_SIZE_MAX: "16"

      # SQLite, deliberately.
      #
      # The acquisition schema is in Supabase; n8n's OWN state (workflows,
      # credentials, execution history) stays local. Two reasons: it saves a
      # Postgres container this host has no room for, and it keeps n8n's
      # execution history out of Supabase's 500 MB free tier, where the loops
      # in workflows 10/30/50 would be the fastest-growing thing in the
      # project. Measured on the existing droplet: 60 MB after two weeks.
      DB_TYPE: sqlite

      # The loops generate a lot of history; without pruning n8n's own
      # database outgrows the disk it sits on.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "${N8N_EXEC_MAX_AGE:-336}"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "all"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"

      # Node's heap ceiling, kept under mem_limit so V8 gives up before the
      # kernel does. An OOM-killed container loses the run silently; a heap
      # error appears in the log and in n8n's execution list.
      NODE_OPTIONS: "--max-old-space-size=${N8N_HEAP_MB:-512}"

      # Supabase's pooler presents a chain rooted in Supabase's OWN private CA
      # ("Supabase Root 2021 CA"), which is not in Node's trust store — so the
      # Postgres node fails with "self-signed certificate in certificate
      # chain". The usual fix found online is allowUnauthorizedCerts, which
      # keeps the encryption and throws away the authentication: you are then
      # encrypted to whoever answered. Trusting the actual CA instead keeps
      # both, and verified chain validation at verify-full.
      NODE_EXTRA_CA_CERTS: /opt/certs/supabase-root-2021.crt

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_acq_data:/home/node/.n8n
      # Read-only, so the 13 workflows can be imported from the CLI:
      #   docker compose exec n8n n8n import:workflow --separate --input=/workflows
      - ./n8n/workflows:/workflows:ro
      # Public CA certificate, not a secret. Committed so a rebuild does not
      # silently lose TLS verification.
      - ./ops/supabase-root-2021.crt:/opt/certs/supabase-root-2021.crt:ro
    networks: [acq]

  caddy:
    image: caddy:2-alpine
    container_name: caddy-acq
    restart: unless-stopped
    # Opt-in: `--profile tls`. A host that already terminates TLS (nginx on
    # the Clinibot droplet) would lose the port-80 bind, and Caddy needs a
    # real domain in N8N_HOST before it can get a certificate at all.
    profiles: ["tls"]
    depends_on: [n8n]
    ports:
      - "80:80"
      - "443:443"
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    environment:
      ACQ_DOMAIN: ${N8N_HOST:?set N8N_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env — Let's Encrypt needs it}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [acq]

volumes:
  n8n_acq_data:
  caddy_data:      # holds the TLS certificates — losing it means re-issuing
  caddy_config:

networks:
  acq:
    driver: bridge
