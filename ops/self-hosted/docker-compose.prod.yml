# =====================================================================
# Production stack for a DEDICATED DigitalOcean droplet.
#
# Use this file when the acquisition system gets its own droplet — which is
# what docs/08-deployment.md now recommends, and why:
#
#   The Clinibot droplet is 1967 MB with ~1.3 GB already in use (measured
#   2026-08-26, ../clinibot/ARCHITECTURE.md §1). n8n alone wants 300-500 MB.
#   That fits only on paper, and the thing it would be squeezing is the
#   process answering real patients on WhatsApp. A prospecting bug should
#   never be able to OOM a clinic's receptionist.
#
# For the co-located variant — a second n8n beside Clinibot's, sharing its
# Postgres — use the plain docker-compose.yml instead. Read the memory note
# in docs/08-deployment.md first.
#
#   cp .env.example .env && "$EDITOR" .env
#   docker compose -f docker-compose.prod.yml up -d
#
# Everything except Caddy binds to 127.0.0.1. Caddy publishes exactly one
# path prefix — /webhook/* — because that is all the outside world needs:
# the unsubscribe endpoint (workflow 110) and the demo hook (workflow 100).
# The n8n UI is reached over an SSH tunnel, never over the internet.
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-acq
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ACQ_POSTGRES_DB:-zenvexa_acq}
      POSTGRES_USER: ${ACQ_POSTGRES_USER:-acq_app}
      POSTGRES_PASSWORD: ${ACQ_POSTGRES_PASSWORD:?set ACQ_POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only. Reach it with: ssh -L 5433:127.0.0.1:5433 acq
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_acq:/var/lib/postgresql/data
      # Migrations run in filename order, but ONLY on the first start of an
      # empty volume. Later migrations are applied by ops/deploy.sh — Postgres
      # ignores this directory once the cluster exists, which is a trap worth
      # naming: adding 010_*.sql here and restarting does nothing at all.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACQ_POSTGRES_USER:-acq_app} -d ${ACQ_POSTGRES_DB:-zenvexa_acq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [acq]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: n8n-acq
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only — n8n has no HTTP auth to fall back on.
      # ssh -L 5679:127.0.0.1:5679 acq   then open http://localhost:5679
      - "127.0.0.1:5679:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
      N8N_PROTOCOL: https
      # The unsubscribe link in every email is built from this. If it is wrong,
      # every opt-out link 404s — which is worse than having none.
      WEBHOOK_URL: ${WEBHOOK_URL:?set WEBHOOK_URL in .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Karachi}
      TZ: ${GENERIC_TIMEZONE:-Asia/Karachi}

      # Behind Caddy, which terminates TLS. Both of these must be set for the
      # owner-account login to persist and for rate limiting to see real IPs.
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      N8N_PUBLIC_API_DISABLED: "true"

      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /tmp
      N8N_PAYLOAD_SIZE_MAX: "16"

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "all"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"

      # n8n's OWN state, in its own database on the same server. Deliberately
      # NOT zenvexa_acq: n8n creates and migrates its own tables, and pointing
      # it at the acquisition database means an n8n upgrade can rewrite schema
      # next to the leads table.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n_acq}
      DB_POSTGRESDB_USER: ${ACQ_POSTGRES_USER:-acq_app}
      DB_POSTGRESDB_PASSWORD: ${ACQ_POSTGRES_PASSWORD:?set ACQ_POSTGRES_PASSWORD in .env}
    volumes:
      - n8n_acq_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks: [acq]

  caddy:
    image: caddy:2-alpine
    container_name: caddy-acq
    restart: unless-stopped
    depends_on: [n8n]
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACQ_DOMAIN: ${N8N_HOST:?set N8N_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env — Let's Encrypt needs it}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [acq]

volumes:
  pg_acq:
  n8n_acq_data:
  caddy_data:      # holds the TLS certificates — losing it means re-issuing
  caddy_config:

networks:
  acq:
    driver: bridge
